services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME:-erp}
      POSTGRES_USER: ${DB_ROOT_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap: the base schema runs once on first init of a fresh data
      # volume (docker-entrypoint-initdb.d executes *.sql alphabetically on
      # empty databases). Phase migrations then run from the api service.
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ROOT_USER:-postgres} -d ${DB_NAME:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-erp_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-erp}
      # Credentials for the migration loop below; DB_ROOT_PASSWORD is already
      # required by the db service at compose-parse time.
      DB_ROOT_USER: ${DB_ROOT_USER:-postgres}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      NODE_ENV: production
      REDIS_HOST: ${REDIS_HOST:-}
      STORAGE_PATH: /app/uploads
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
    volumes:
      - uploads:/app/uploads
    command: >
      sh -c "
      if [ \"$$RUN_MIGRATIONS\" = \"true\" ]; then
        echo 'Running migrations...';
        for f in /app/db/migrations/*.sql; do
          echo \"  $$f\";
          PGPASSWORD=\"$$DB_ROOT_PASSWORD\" psql -h \"$$DB_HOST\" -U \"$$DB_ROOT_USER\" -d \"$$DB_NAME\" -v ON_ERROR_STOP=1 -v erp_app_password=\"$$DB_PASSWORD\" -f \"$$f\" || exit 1;
        done;
      fi;
      node dist/main.js"
    healthcheck:
      # node:22-slim has no wget/curl; global fetch keeps the check dependency-free
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
  uploads:
