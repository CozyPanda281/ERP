services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-erp}
      POSTGRES_USER: ${DB_ROOT_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ROOT_USER:-postgres} -d ${DB_NAME:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-erp_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-erp}
      NODE_ENV: production
      REDIS_HOST: ${REDIS_HOST:-}
      STORAGE_PATH: /app/uploads
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
    volumes:
      - uploads:/app/uploads
    command: >
      sh -c "
      if [ \"$$RUN_MIGRATIONS\" = \"true\" ]; then
        echo 'Running migrations...';
        for f in /app/db/migrations/*.sql; do
          echo \"  $$f\";
          PGPASSWORD=\"$$DB_ROOT_PASSWORD\" psql -h \"$$DB_HOST\" -U \"$$DB_ROOT_USER\" -d \"$$DB_NAME\" -v ON_ERROR_STOP=1 -v erp_app_password=\"$$DB_PASSWORD\" -f \"$$f\" || exit 1;
        done;
      fi;
      node dist/src/main.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/docs >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
  uploads:
