name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Apply schema for e2e
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d erp -v ON_ERROR_STOP=1 -f ../database/001_schema.sql
          for f in db/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d erp -v ON_ERROR_STOP=1 -v erp_app_password=erp_app_ci_pw -f "$f"
          done
      - run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: erp
          # jwt.config.ts's assertStrongSecret rejects weak/absent secrets at
          # module load — the e2e suite boots the whole AppModule. All values
          # below are >= 32 characters.
          JWT_SECRET: ci-e2e-secret-4f9c2b8a1d7e6f30ab00ff11ee
          JWT_REFRESH_SECRET: ci-e2e-refresh-secret-8a3d5f2c7b1e9d04
          ENCRYPTION_KEY: ci-e2e-encryption-key-0123456789abcdef

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/log-audit.sh
